    <script>
      (function() {
        try {
          var savedFont = localStorage.getItem('CS_FONT') || 'montserrat';
          document.documentElement.classList.remove('font-opt-poppins', 'font-opt-montserrat', 'font-opt-inter', 'font-opt-mono', 'font-opt-jetbrains', 'font-opt-serif', 'font-opt-playfair', 'font-opt-space');
          document.documentElement.classList.add('font-opt-' + savedFont);
        } catch (e) {
          document.documentElement.classList.add('font-opt-montserrat');
        }
      })();
    </script>
